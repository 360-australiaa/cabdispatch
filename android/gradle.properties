org.gradle.jvmargs=-Xmx1280m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# This dev machine is memory-constrained (other processes leave only ~3GB free); R8/dexer
# workers running at default parallelism OOM-crash the native JVM heap (see hs_err_pid*.log).
# Capping Gradle's own worker/task parallelism (not a dependency or source change) keeps the
# build's peak memory footprint low enough to finish reliably. Safe to raise/remove on a
# machine with more headroom.
org.gradle.workers.max=2
org.gradle.parallel=false
# W6 (Tests and CI depth, 2026-09-12), task 6: the Gradle build cache reuses task outputs (by
# input hash) across builds/invocations instead of re-running them -- a pure win on this
# memory-constrained box (it saves WORK, not RAM: a cache hit skips a task's execution outright
# rather than running it with a smaller heap) and on CI, where actions/cache below persists
# ~/.gradle/caches between runs so a PR that touches one module does not recompile the world.
org.gradle.caching=true
