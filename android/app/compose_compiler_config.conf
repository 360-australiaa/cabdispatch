// Compose compiler stability configuration (W5, 2026-09-12 optimisation plan).
//
// Wired via `composeCompiler.stabilityConfigurationFiles` in app/build.gradle.kts. Each line below
// is a fully-qualified class the Compose compiler should treat as STABLE even though its own
// stability inference can't prove it — either because the class is a plain Java type with no
// Kotlin stability metadata at all (java.math.BigDecimal, java.time.*), or because it is one of
// this app's own data classes whose only "unstable-looking" members are BigDecimal fields or
// read-only `List<T>` properties that this codebase never mutates in place (verified against
// FareEngineImpl: every FareState.tollsApplied/.autoTollsApplied/.unpricedTollRoads update is a
// `.copy(x = x + y)` or `.filterNot { }` producing a brand-new list, never a MutableList held and
// mutated after being handed to a composable — see FareEngine.kt's addToll/removeAutoToll/
// dismissUnpricedToll). Without this file every composable taking a FareState parameter — which
// includes MeterDial and HiredScreen, the two composables that recompose once per fare tick for
// the whole duration of a hiring — is marked "unstable" by the compose compiler report, which
// disables the compiler's own skip-if-unchanged optimisation for every OTHER parameter on those
// composables, not just the ones that actually change every tick.
//
// Regenerate the compose_metrics/compose_reports directories (see the composeMetrics Gradle
// property this file's build.gradle.kts block documents) after editing this list to confirm the
// target composables (MeterDial, HiredScreen, DeckHomeScreen) drop to zero unstable parameters.

// -- JDK/JRE types with no Kotlin stability metadata --
java.math.BigDecimal
java.time.Instant
java.time.LocalDate
java.time.LocalDateTime
java.time.LocalTime
java.time.Duration
java.time.ZonedDateTime
java.time.OffsetDateTime

// -- This app's own domain models (au.com.threesixty.cabdispatch.domain) --
// Every one of these is either all-BigDecimal/enum/primitive fields, or a read-only List<T> of
// another entry on this same list — see the header comment above for why that is safe here.
au.com.threesixty.cabdispatch.domain.FareBreakdown
au.com.threesixty.cabdispatch.domain.FareState
au.com.threesixty.cabdispatch.domain.TripContext
au.com.threesixty.cabdispatch.domain.TollPreset
au.com.threesixty.cabdispatch.domain.AutoTollEntry
au.com.threesixty.cabdispatch.domain.UnpricedTollRoad
au.com.threesixty.cabdispatch.domain.AutoTollAlert
au.com.threesixty.cabdispatch.domain.ActiveBlackout
au.com.threesixty.cabdispatch.domain.ResolvedBlackout

// -- Wire DTOs (au.com.threesixty.cabdispatch.data.remote) carried inside the domain models above
// (TripContext.tariff) --  every field is a String/Boolean/nullable-String (the project's
// decimal-as-string money convention, see ApiService.kt's header note), so these are genuinely
// immutable once deserialized.
au.com.threesixty.cabdispatch.data.remote.TariffDto
au.com.threesixty.cabdispatch.data.remote.JurisdictionDto
