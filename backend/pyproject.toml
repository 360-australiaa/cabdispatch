[project]
name = "cab-dispatch-backend"
version = "0.1.0"
description = "Cab Dispatch — multi-tenant NSW taxi-meter SaaS backend"
requires-python = ">=3.12"
dependencies = [
    # zoneinfo has no bundled database on Windows (and some slim Linux images),
    # and app.services.fare_engine.NSW_FARE_ZONE must resolve everywhere the fare
    # engine runs -- including a developer's machine running the test suite.
    # A missing tzdata here is a ZoneInfoNotFoundError at import, not a subtle
    # mispricing, but it is still better to depend on it explicitly than to rely
    # on the deployment image happening to carry system tzdata.
    "tzdata>=2024.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",  # passlib 1.7.4 is incompatible with bcrypt>=4.1's dropped __about__ attr
    "python-multipart>=0.0.12",
    # Rate limiting (app/core/ratelimit.py). slowapi supplies the per-route
    # decorator + 429 plumbing; `limits` (its own dependency, pinned explicitly
    # because we use it directly for the body-keyed limits slowapi's sync
    # key_func cannot express) supplies the storage backends and the fixed-window
    # strategy shared by both. Redis is optional at runtime -- absent it, the
    # in-memory backend is used; see that module's docstring.
    "slowapi>=0.1.9",
    "limits>=3.0",
    "stripe>=11.0",
    "redis>=5.2",
    "websockets>=13.1",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "fpdf2>=2.8.7",
    "pyotp>=2.10.0",
    "cryptography>=49.0.0",
    "tzdata>=2024.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends(...)-in-default-argument pattern is idiomatic, not a bug.
# BLE001: the Redis revocation-store fallback deliberately catches any exception
# from the redis client so an unreachable Redis never crashes the app.
ignore = ["B008", "BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
