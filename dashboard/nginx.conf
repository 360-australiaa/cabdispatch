# Serves the built Vite SPA. try_files falls back to index.html for any
# unmatched path so react-router-dom's client-side routes (e.g. /duress,
# /fleet) work on a hard refresh/direct link, not just client-side nav.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets Vite fingerprints by content hash -- safe to cache
    # aggressively; index.html itself is intentionally NOT matched here so a
    # redeploy is always picked up on next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}